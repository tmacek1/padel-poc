<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - PadelHub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #2563eb;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon span {
      color: white;
      font-size: 40px;
      font-weight: bold;
    }
    h1 {
      color: #1f2937;
      margin-bottom: 12px;
      font-size: 24px;
    }
    p {
      color: #6b7280;
      margin-bottom: 24px;
      max-width: 300px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="icon">
    <span>P</span>
  </div>
  <h1>Nema internetske veze</h1>
  <p>Provjerite svoju internetsku vezu i pokušajte ponovo.</p>
  <button onclick="window.location.reload()">Pokušaj ponovo</button>
</body>
</html>
